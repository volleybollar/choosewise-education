<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #f7f4ec;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 100px;
    padding: 60px 120px;
    font-family: 'Work Sans', sans-serif;
  }
  svg { width: 680px; height: 680px; flex-shrink: 0; }
  .right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 40px;
    max-width: 700px;
  }
  .right h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 44px;
    font-weight: 400;
    line-height: 1.1;
    color: #1e1e1c;
    letter-spacing: -0.5px;
  }
  .right h2 em { font-style: italic; color: #2f4a3a; }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .step {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .step-letter {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 28px;
    font-weight: 500;
    min-width: 30px;
  }
  .step-text {
    font-size: 18px;
    color: #3a3a38;
  }
  .l-green { color: #2f4a3a; }
  .l-gold { color: #a07d2e; }
  .l-teal { color: #2e6d7a; }
  .l-terra { color: #b35a3a; }
  .quote {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
    color: #2f4a3a;
    margin-top: 10px;
    padding-top: 30px;
    border-top: 1px solid rgba(30,30,28,0.1);
  }
  .attr {
    font-size: 14px;
    color: #a5a59f;
  }
</style>
</head>
<body>
  <svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e1e1c" flood-opacity="0.06"/>
      </filter>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#2f4a3a" opacity="0.6"/>
      </marker>
    </defs>
    <text x="350" y="48" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="400" fill="#1e1e1c" letter-spacing="-0.5">RÄTT-modellen</text>
    <text x="350" y="78" text-anchor="middle" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#5a5a57" letter-spacing="0.3">Rätt verktyg vid rätt tillfälle</text>
    <rect x="255" y="160" width="190" height="75" rx="12" fill="#d4e8db" stroke="#2f4a3a" stroke-width="2" filter="url(#shadow)"/>
    <text x="350" y="194" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#2f4a3a">R</text>
    <text x="350" y="220" text-anchor="middle" font-family="'Work Sans', sans-serif" font-size="13" font-weight="500" fill="#2f4a3a">Reflektera</text>
    <rect x="470" y="353" width="190" height="75" rx="12" fill="#f5ecd0" stroke="#c69c3c" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="387" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#a07d2e">Ä</text>
    <text x="565" y="413" text-anchor="middle" font-family="'Work Sans', sans-serif" font-size="13" font-weight="500" fill="#a07d2e">Ämnet avgör</text>
    <rect x="255" y="545" width="190" height="75" rx="12" fill="#d0e8ec" stroke="#3a7a8a" stroke-width="2" filter="url(#shadow)"/>
    <text x="350" y="579" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#2e6d7a">T</text>
    <text x="350" y="605" text-anchor="middle" font-family="'Work Sans', sans-serif" font-size="13" font-weight="500" fill="#2e6d7a">Tillämpa rätt verktyg</text>
    <rect x="40" y="353" width="190" height="75" rx="12" fill="#f5d8cc" stroke="#b35a3a" stroke-width="2" filter="url(#shadow)"/>
    <text x="135" y="387" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#b35a3a">T</text>
    <text x="135" y="413" text-anchor="middle" font-family="'Work Sans', sans-serif" font-size="13" font-weight="500" fill="#b35a3a">Testa &amp; utvärdera</text>
    <path d="M 445,197 C 530,197 565,270 565,345" fill="none" stroke="#2f4a3a" stroke-width="2.2" opacity="0.45" marker-end="url(#arr)"/>
    <path d="M 565,428 C 565,510 530,583 453,583" fill="none" stroke="#2f4a3a" stroke-width="2.2" opacity="0.45" marker-end="url(#arr)"/>
    <path d="M 255,583 C 170,583 135,510 135,436" fill="none" stroke="#2f4a3a" stroke-width="2.2" opacity="0.45" marker-end="url(#arr)"/>
    <path d="M 135,353 C 135,270 170,197 247,197" fill="none" stroke="#2f4a3a" stroke-width="2.2" opacity="0.45" marker-end="url(#arr)"/>
    <circle cx="350" cy="390" r="65" fill="#ffffff" stroke="#2f4a3a" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="350" y="383" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="500" fill="#2f4a3a">Professionellt</text>
    <text x="350" y="403" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="500" fill="#2f4a3a">omdöme</text>
  </svg>
  <div class="right">
    <h2>Rätt verktyg vid <em>rätt tillfälle</em></h2>
    <div class="steps">
      <div class="step"><span class="step-letter l-green">R</span><span class="step-text">Reflektera över lärandet som ska ske</span></div>
      <div class="step"><span class="step-letter l-gold">Ä</span><span class="step-text">Ämnet avgör</span></div>
      <div class="step"><span class="step-letter l-teal">T</span><span class="step-text">Tillämpa rätt verktyg</span></div>
      <div class="step"><span class="step-letter l-terra">T</span><span class="step-text">Testa och utvärdera</span></div>
    </div>
    <p class="quote">"Är det fler verktyg eller bättre omdöme som behövs?"</p>
    <p class="attr">Johan Lindström · JL Skolutveckling AB · jlsu.se</p>
  </div>
</body>
</html>
